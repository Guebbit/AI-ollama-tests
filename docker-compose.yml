services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_DEBUG=${OLLAMA_DEBUG:-INFO}
      - OLLAMA_DEBUG_LOG_REQUESTS=${OLLAMA_DEBUG:-INFO}
    volumes:
      # To correctly create and pull models in this common directory I can't put "Read-only", but treat like it, BE CAREFUL
      - /home/${LINUX_USERNAME}/.ollama:/root/.ollama:z,rw
      # Writable data for container-specific temp/cache
      - ollama-data:/root/.ollama-data:rw,Z,rprivate
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: ${OLLAMA_MEM_LIMIT:-16g}
    shm_size: ${OLLAMA_SHM_SIZE:-8g}
    cpus: "${OLLAMA_CPUS:-8.0}"
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Rome}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_OLLAMA_BASE_URL=${N8N_OLLAMA_BASE_URL}
      - N8N_LLM_FAST_MODEL=${N8N_LLM_FAST_MODEL}
      - N8N_LLM_REASONING_MODEL=${N8N_LLM_REASONING_MODEL}
      - N8N_LLM_REASONING_MODEL_2=${N8N_LLM_REASONING_MODEL_2}
      - N8N_LLM_CODE_MODEL=${N8N_LLM_CODE_MODEL}
      - N8N_LLM_VISION_MODEL=${N8N_LLM_VISION_MODEL}
      - N8N_LLM_EMBED_MODEL=${N8N_LLM_EMBED_MODEL}
      - N8N_NEWS_INTERESTS=${N8N_NEWS_INTERESTS}
      - N8N_LLM_NUM_GPU=${N8N_LLM_NUM_GPU}
      - N8N_OVERVIEW_MAX_CHARS=${N8N_OVERVIEW_MAX_CHARS}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n-output:/data:rw,Z,U
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    depends_on:
      - ollama
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MAX_RESPONSE_TOKENS=${MAX_RESPONSE_TOKENS:-1024}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-secret-key-change-me-in-production}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-120}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
    volumes:
      - open-webui-data:/app/backend/data:Z
    restart: unless-stopped

volumes:
  ollama-data:
    driver: local
  n8n-data:
    driver: local
  open-webui-data:
    driver: local